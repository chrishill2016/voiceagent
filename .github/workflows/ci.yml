name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VoiceAgent.slnx

      - name: Build
        run: dotnet build VoiceAgent.slnx --no-restore -c Release -p:Version=1.0.${{ github.run_number }}

      - name: Test
        run: dotnet test VoiceAgent.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

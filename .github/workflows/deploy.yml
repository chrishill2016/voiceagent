name: Deploy

# Builds, tests and deploys to Azure Container Apps when a PR is merged to main.
# One-off setup: docs/SETUP.md, step 9.
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Variables: AZURE_RESOURCE_GROUP, AZURE_ACR_NAME, AZURE_CONTAINER_APP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VoiceAgent.slnx
      - run: dotnet build VoiceAgent.slnx --no-restore -c Release -p:Version=${{ env.VERSION }}
      - run: dotnet test VoiceAgent.slnx --no-build -c Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Skipped until the Azure variables are set, so merges don't fail before Azure exists.
    if: ${{ vars.AZURE_CONTAINER_APP != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, no stored passwords)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "voiceagent:${{ env.VERSION }}" \
            --build-arg VERSION=${{ env.VERSION }} \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_NAME }}.azurecr.io/voiceagent:${{ env.VERSION }}"
